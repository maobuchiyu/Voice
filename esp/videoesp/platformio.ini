[env:esp32s3_n16r8]
platform = espressif32@7.0.1
board = acousticlab_esp32s3_n16r8
framework = arduino
extra_scripts = pre:scripts/embed_web.py
build_src_flags = -Werror
build_flags =
    -DWEBSOCKETS_SERVER_CLIENT_MAX=1
    -DC5_UART_RX_PIN=16
    -DC5_UART_TX_PIN=17
    -Wall
    -Wextra
lib_deps =
    links2004/WebSockets@2.7.2
    bblanchon/ArduinoJson@6.21.5
monitor_speed = 115200
upload_port = COM8
monitor_port = COM8
